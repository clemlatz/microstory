services:
  microstory:
    build: .
    ports:
      - '3000:3000'
    environment:
      LLM_SERVER_URL: ${LLM_SERVER_URL:-http://host.docker.internal:8000}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-local-model}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DATABASE_PATH: /data/chat.db
    volumes:
      - ${MICROSTORY_STORAGE_PATH:-${HOME}/server/storage/microstory}:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
